<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/js/theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet"><title>BU Merch - Order now</title></head><body>
<div id="nav"></div>
<main class="container pb-5" style="max-width:620px">
  <a href="/index.html" class="small text-decoration-none">&larr; Back to shop</a>
  <h2 class="my-3">Order now</h2>

  <div class="panel mb-3" id="item"><div class="muted">Loading item...</div></div>

  <div class="panel d-none" id="checkout">
    <h5>Where will you pick up?</h5>
    <select id="campus" class="form-select mt-2 mb-2" aria-label="Pickup campus"></select>
    <div class="reminder small mb-4" id="campusNote"></div>

    <h5>How will you pay?</h5>
    <div class="d-grid gap-2 my-3">
      <label class="pay-opt"><input type="radio" name="pm" value="gcash_online" checked class="form-check-input me-2"><b>Online payment</b><div class="muted small ms-4">Pay now with a card or Maya wallet on a secure payment page. Your order is confirmed automatically.</div></label>
      <label class="pay-opt"><input type="radio" name="pm" value="gcash_manual" class="form-check-input me-2"><b>GCash (send receipt)</b><div class="muted small ms-4">Send to the merch GCash number, then upload your receipt for staff to verify.</div></label>
      <div id="gcashInfo" class="d-none"></div>
      <label class="pay-opt"><input type="radio" name="pm" value="onsite" class="form-check-input me-2"><b>Pay onsite</b><div class="muted small ms-4">Pay in cash when you pick up your order.</div></label>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3"><span>Total</span><span class="display-num fs-3 fw-bold" id="total"></span></div>
    <button class="btn btn-gold w-100 btn-lg" id="placeBtn">Place order</button>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
renderNav(''); renderFooter();
const $ = (id) => document.getElementById(id);
const productId = new URLSearchParams(location.search).get('product');
let campuses = [], product = null, qty = 1;

if (requireLogin()) init();

async function init() {
  try {
    const [list, camps] = await Promise.all([api('/products', { auth: false }), api('/campuses', { auth: false })]);
    product = list.find((p) => p.id === productId);
    campuses = camps;

    const closed = product && product.preorder_deadline && new Date(product.preorder_deadline) < new Date();
    if (!product || closed || product.stock <= 0) {
      $('item').innerHTML = '<div class="text-center py-3"><div class="fw-bold mb-1">This item is not available for pre-order.</div><a href="/index.html">Back to shop</a></div>';
      return;
    }

    const saved = store.get('ms_campus') || Auth.user()?.campus_id;
    $('campus').innerHTML = '<option value="">Choose your college or campus</option>' + campuses.map((c) =>
      '<option value="' + c.id + '"' + (c.id === saved ? ' selected' : '') + '>' + esc(c.name) + (c.is_main ? ' (Main)' : '') + '</option>').join('');
    showNote(); drawItem();
    $('checkout').classList.remove('d-none');
  } catch (e) { fail(e); }
}

function drawItem() {
  $('item').innerHTML =
    '<div class="d-flex flex-wrap align-items-center gap-3">' +
      (product.image_url ? '<img class="thumb" src="' + esc(product.image_url) + '" alt="">' : '<div class="thumb d-flex align-items-center justify-content-center fw-bold">' + esc(product.name.charAt(0)) + '</div>') +
      '<div class="flex-grow-1" style="min-width:140px"><div class="fw-bold">' + esc(product.name) + '</div><div class="muted small">' + peso(product.price) + ' each</div></div>' +
      '<div class="btn-group btn-group-sm"><button class="btn btn-outline-ms" data-a="dec" aria-label="Less">-</button><span class="btn disabled qty-n">' + qty + '</span><button class="btn btn-outline-ms" data-a="inc" aria-label="More">+</button></div>' +
    '</div>';
  $('total').textContent = peso(product.price * qty);
}
$('item').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-a]'); if (!b || !product) return;
  if (b.dataset.a === 'inc') { if (qty >= product.stock) return toast('No more stock available', 'warning'); qty++; }
  if (b.dataset.a === 'dec' && qty > 1) qty--;
  drawItem();
});

function showNote() {
  const c = campuses.find((x) => x.id === $('campus').value);
  $('campusNote').innerHTML = c ? '<b>' + esc(c.name) + '</b>' + (c.address ? '<br>' + esc(c.address) : '') + '<br>' + esc(c.pickup_note || 'Bring your school ID.')
    : 'Choose the college or campus where you want to pick up your order. Some orders may be picked up at the Main Campus; we will email you if that applies.';
}
$('campus').addEventListener('change', () => { store.set('ms_campus', $('campus').value); showNote(); });

$('placeBtn').addEventListener('click', async (e) => {
  if (!requireLogin()) return;
  if (!$('campus').value) { toast('Please choose a pickup campus', 'warning'); $('campus').focus(); return; }
  const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Placing order...';
  const method = document.querySelector('input[name=pm]:checked').value;
  let order;
  try {
    // Only this one product is ordered. The cart is not touched.
    order = await api('/orders', { method: 'POST', body: { payment_method: method, campus_id: $('campus').value, items: [{ product_id: product.id, quantity: qty }] } });
  } catch (err) { fail(err); btn.disabled = false; btn.textContent = 'Place order'; return; }
  try {
    if (method === 'gcash_online') { const r = await api('/payments/checkout', { method: 'POST', body: { order_id: order.id } }); location.href = r.checkout_url; return; }
  } catch (err) { toast('Order placed, but the payment page could not open: ' + err.message, 'warning'); }
  location.href = '/order-status.html?order=' + order.id;
});

// show the merch GCash account when "GCash (send receipt)" is selected
(function () {
  let gc;
  async function refresh() {
    const on = document.querySelector('input[name=pm]:checked')?.value === 'gcash_manual';
    const box = document.getElementById('gcashInfo'); if (!box) return;
    box.classList.toggle('d-none', !on); if (!on) return;
    if (gc === undefined) gc = await loadGcash();
    box.innerHTML = gcashBox(gc);
  }
  document.querySelectorAll('input[name=pm]').forEach((r) => r.addEventListener('change', refresh));
})();
</script></body></html>
