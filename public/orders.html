<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/js/theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet"><title>BU Merch - My orders</title></head><body>
<div id="nav"></div>
<main class="container pb-5">
  <div class="ux-crumb">Settings / <b>My orders</b></div>
  <h1 class="ux-title">My orders</h1>
  <div class="ux-layout">
    <aside id="side"></aside>
    <div class="ux-card">
      <div class="ux-head">
        <span class="ux-ico"><i class="ico" data-i="bag"></i></span>
        <div class="grow"><h2>Order history</h2><p id="summary">Loading...</p></div>
        <div class="ux-seg d-none d-sm-inline-flex" id="seg">
          <button class="on" data-f="all">All</button><button data-f="active">In progress</button><button data-f="done">Completed</button><button data-f="cancelled">Cancelled</button>
        </div>
      </div>
      <div class="ux-body pb-2 d-sm-none"><div class="ux-seg" id="segM">
        <button class="on" data-f="all">All</button><button data-f="active">In progress</button><button data-f="done">Done</button><button data-f="cancelled">Cancelled</button></div></div>
      <div class="ux-th"><div>Order</div><div>Items</div><div>Status</div><div class="r">Total</div></div>
      <div id="list"></div>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
renderNav(''); renderFooter(); hydrateIcons(); renderAccountSide('orders');
let all = [], filter = 'all';
const isActive = (o) => !['completed', 'cancelled'].includes(o.status);
const match = (o) => filter === 'all' || (filter === 'active' && isActive(o)) || (filter === 'done' && o.status === 'completed') || (filter === 'cancelled' && o.status === 'cancelled');

function draw() {
  const list = all.filter(match);
  document.getElementById('list').innerHTML = list.length ? list.map((o) => {
    const qty = o.order_items.reduce((n, i) => n + i.quantity, 0);
    return '<a class="ux-tr" href="/order-status.html?order=' + o.id + '">' +
      '<div class="c-no"><div class="no">#' + o.order_no + '</div><div class="sub">' + fmtDate(o.created_at) + '</div></div>' +
      '<div class="items">' + o.order_items.map((i) => esc(i.product_name) + ' x' + i.quantity).join(', ') + '</div>' +
      '<div class="bd">' + badge(STATUS, o.status) + ' ' + badge(PAY_STATUS, o.payment_status) + '</div>' +
      '<div class="tot">' + peso(o.total) + '</div></a>';
  }).join('') : '<div class="ux-empty">' + (all.length ? 'No orders in this view.' : 'No orders yet. <a href="/index.html">Start shopping</a>') + '</div>';
}
document.querySelectorAll('.ux-seg').forEach((seg) => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-f]'); if (!b) return; filter = b.dataset.f;
  document.querySelectorAll('.ux-seg button').forEach((x) => x.classList.toggle('on', x.dataset.f === filter)); draw();
}));

if (requireLogin()) (async () => {
  try {
    all = await api('/orders/mine');
    store.set('ms_order_count', all.length);
    const active = all.filter(isActive).length;
    document.getElementById('summary').textContent = all.length ? all.length + ' order' + (all.length === 1 ? '' : 's') + (active ? ' · ' + active + ' in progress' : '') : 'You have not placed any orders yet.';
    draw();
  } catch (e) { fail(e); }
})();
</script></body></html>
