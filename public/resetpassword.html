<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/js/theme.js"></script><script src="/js/loader.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet"><title>BU Merch - Set a new password</title></head><body class="auth-body">
<a class="auth-back" href="/login.html" style="max-width:480px">&larr; Back to log in</a>
<main class="auth-card" style="max-width:480px;grid-template-columns:1fr;min-height:0">
  <section class="auth-form">
    <div class="auth-brand brand">BU <span>Merch</span></div>

    <form id="viewReset" class="d-none" novalidate>
      <h1>Set a new password</h1>
      <label for="nPass">New password (8+ characters)</label>
      <div class="pw"><input id="nPass" type="password" class="pill" minlength="8" autocomplete="new-password" required>
        <button type="button" class="eye" data-eye="nPass" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <label for="nPass2">Confirm new password</label>
      <input id="nPass2" type="password" class="pill" autocomplete="new-password" required>
      <button class="pill-btn" id="rBtn">Update password</button>
    </form>

    <div id="viewBad" class="d-none">
      <h1>Link expired</h1>
      <p class="muted">This reset link is invalid or has expired. Reset links work once and only for a short time.</p>
      <a class="pill-btn d-flex align-items-center justify-content-center text-decoration-none" href="/login.html#forgot">Send a new link</a>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script><script src="/js/select.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// Supabase puts the temporary reset token in the part of the URL after the #
const params = new URLSearchParams(location.hash.slice(1));
const token = params.get('access_token');
const valid = token && (params.get('type') || 'recovery') === 'recovery' && !params.get('error');
history.replaceState(null, '', location.pathname); // remove the token from the address bar
$(valid ? 'viewReset' : 'viewBad').classList.remove('d-none');

document.querySelectorAll('[data-eye]').forEach((b) => b.addEventListener('click', () => {
  const i = $(b.dataset.eye); const show = i.type === 'password'; i.type = show ? 'text' : 'password';
  b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}));

$('viewReset').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = $('nPass').value;
  if (p.length < 8) return toast('Password must be at least 8 characters', 'warning');
  if (p !== $('nPass2').value) return toast('Passwords do not match', 'warning');
  const b = $('rBtn'); b.disabled = true;
  try {
    await api('/auth/reset', { method: 'POST', auth: false, body: { access_token: token, password: p } });
    toast('Password updated. Please log in.', 'success');
    setTimeout(() => { location.href = '/login.html'; }, 1500);
  } catch (err) { fail(err); b.disabled = false; }
});
</script></body></html>
