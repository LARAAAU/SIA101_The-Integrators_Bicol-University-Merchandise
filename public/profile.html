<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/js/theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet"><title>BU Merch - Account</title></head><body>
<div id="nav"></div>
<main class="container pb-5">
  <div class="ux-crumb">Settings / <b id="crumb">Account</b></div>
  <h1 class="ux-title" id="title">Account settings</h1>
  <div class="ux-layout">
    <aside id="side"></aside>
    <div>
      <!-- ACCOUNT -->
      <section id="pAccount">
        <form class="ux-card" id="fPersonal" novalidate>
          <div class="ux-head"><span class="ux-ico"><i class="ico" data-i="user"></i></span><div><h2>Personal profile</h2><p>How we reach you about your orders.</p></div></div>
          <div class="ux-body"><div class="ux-profile">
            <div><span class="lbl">Avatar</span><span class="avatar xl" id="pAvatar"></span></div>
            <div class="ux-grid2">
              <div class="ux-f"><label class="lbl" for="pFirst">First name</label><div class="ux-in"><i class="ico" data-i="user"></i><input id="pFirst" required></div></div>
              <div class="ux-f"><label class="lbl" for="pMiddle">Middle name</label><div class="ux-in"><i class="ico" data-i="user"></i><input id="pMiddle"></div></div>
              <div class="ux-f"><label class="lbl" for="pLast">Last name</label><div class="ux-in"><i class="ico" data-i="user"></i><input id="pLast" required></div></div>
              <div class="ux-f"><label class="lbl" for="pPhone">Mobile number</label><div class="ux-in"><i class="ico" data-i="phone"></i><input id="pPhone" type="tel" placeholder="09123456789"></div></div>
              <div class="ux-f ux-span2"><label class="lbl" for="pAddress">Home address</label><div class="ux-in"><i class="ico" data-i="pin"></i><input id="pAddress"></div></div>
              <div class="ux-f ux-span2 mb-0"><label class="lbl" for="pEmail">Email</label><div class="ux-in dis"><i class="ico" data-i="mail"></i><input id="pEmail" disabled></div></div>
            </div>
          </div></div>
          <div class="ux-foot"><span class="ux-hint" id="hintP"></span><button class="btn btn-ms btn-sm px-3" id="saveP" disabled>Save changes</button></div>
        </form>

        <form class="ux-card" id="fSchool" novalidate>
          <div class="ux-head"><span class="ux-ico"><i class="ico" data-i="cap"></i></span><div><h2>School details</h2><p>Used to prepare your pickup.</p></div></div>
          <div class="ux-body"><div class="ux-grid2">
            <div class="ux-f"><label class="lbl" for="pStudentId">Student ID</label><div class="ux-in"><i class="ico" data-i="id"></i><input id="pStudentId"></div></div>
            <div class="ux-f"><label class="lbl" for="pCourse">Course</label><div class="ux-in"><i class="ico" data-i="cap"></i><input id="pCourse"></div></div>
            <div class="ux-f"><label class="lbl" for="pYear">Year level</label><div class="ux-in"><select id="pYear"><option value="">Select</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>5th Year</option></select><i class="ico chev" data-i="chev"></i></div></div>
            <div class="ux-f"><label class="lbl" for="pBlock">Block</label><div class="ux-in"><i class="ico" data-i="hash"></i><input id="pBlock" maxlength="5"></div></div>
            <div class="ux-f ux-span2 mb-0"><label class="lbl" for="pCampus">College / Campus</label><div class="ux-in"><i class="ico" data-i="pin"></i><select id="pCampus"></select><i class="ico chev" data-i="chev"></i></div></div>
          </div></div>
          <div class="ux-foot"><span class="ux-hint" id="hintS"></span><button class="btn btn-ms btn-sm px-3" id="saveS" disabled>Save changes</button></div>
        </form>
      </section>

      <!-- SECURITY -->
      <section id="pSecurity" class="d-none">
        <form class="ux-card" id="fPass" novalidate>
          <div class="ux-head"><span class="ux-ico"><i class="ico" data-i="lock"></i></span><div><h2>Password</h2><p>Use at least 8 characters.</p></div></div>
          <div class="ux-body">
            <div class="ux-f"><label class="lbl" for="cur">Current password</label><div class="ux-in"><i class="ico" data-i="lock"></i><input id="cur" type="password" autocomplete="current-password"></div></div>
            <div class="ux-grid2">
              <div class="ux-f mb-0"><label class="lbl" for="nw">New password</label><div class="ux-in"><i class="ico" data-i="lock"></i><input id="nw" type="password" autocomplete="new-password"></div></div>
              <div class="ux-f mb-0"><label class="lbl" for="nw2">Confirm new password</label><div class="ux-in"><i class="ico" data-i="lock"></i><input id="nw2" type="password" autocomplete="new-password"></div></div>
            </div>
          </div>
          <div class="ux-foot"><button class="btn btn-ms btn-sm px-3">Update password</button></div>
        </form>
        <div class="ux-card">
          <div class="ux-head"><span class="ux-ico"><i class="ico" data-i="device"></i></span><div><h2>Active session</h2><p>Where you are signed in right now.</p></div></div>
          <div class="ux-body"><div class="ux-row"><i class="ico" data-i="device"></i><div class="flex-grow-1 min-w-0"><div class="fw-medium">This device</div><div class="muted small text-break" id="sessEmail"></div></div>
            <button class="btn btn-outline-ms btn-sm px-3" id="sessOut" type="button">Log out</button></div></div>
        </div>
      </section>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
renderNav(''); renderFooter(); hydrateIcons();
let me = null;

function panel() {
  const sec = location.hash === '#security';
  pAccount.classList.toggle('d-none', sec); pSecurity.classList.toggle('d-none', !sec);
  title.textContent = sec ? 'Security' : 'Account settings'; crumb.textContent = sec ? 'Security' : 'Account';
  renderAccountSide(sec ? 'security' : 'account');
}
window.addEventListener('hashchange', panel); panel();
sessOut.addEventListener('click', Auth.logout);

function fill(m) {
  const parts = (m.full_name || '').trim().split(/\s+/);
  pFirst.value = m.first_name ?? (parts.length > 1 ? parts.slice(0, -1).join(' ') : parts[0] || '');
  pMiddle.value = m.middle_name || ''; pLast.value = m.last_name ?? (parts.length > 1 ? parts[parts.length - 1] : '');
  pPhone.value = m.phone || ''; pAddress.value = m.address || ''; pEmail.value = m.university_email;
  pStudentId.value = m.student_id || ''; pCourse.value = m.course || ''; pYear.value = m.year_level || ''; pBlock.value = m.block || ''; pCampus.value = m.campus_id || '';
  pAvatar.textContent = (m.first_name || m.full_name || '?').charAt(0).toUpperCase();
  sessEmail.textContent = 'Signed in as ' + m.university_email;
}
function dirty(form, btn, hint) { form.addEventListener('input', () => { btn.disabled = false; hint.textContent = 'Unsaved changes'; }); form.addEventListener('change', () => { btn.disabled = false; hint.textContent = 'Unsaved changes'; }); }
dirty(fPersonal, saveP, hintP); dirty(fSchool, saveS, hintS);

async function save(body, okMsg) {
  try { const m = await api('/auth/me', { method: 'PUT', body }); store.set('ms_user', m); me = m; renderNav(''); toast(okMsg, 'success'); return m; }
  catch (err) { fail(err); }
}
fPersonal.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!pFirst.value.trim() || !pLast.value.trim()) return toast('First and last name are required', 'warning');
  const m = await save({ first_name: pFirst.value, middle_name: pMiddle.value, last_name: pLast.value, phone: pPhone.value, address: pAddress.value }, 'Profile saved');
  if (m) { fill(m); saveP.disabled = true; hintP.textContent = ''; }
});
fSchool.addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = await save({ student_id: pStudentId.value, course: pCourse.value, year_level: pYear.value, block: pBlock.value, campus_id: pCampus.value }, 'School details saved');
  if (m) { fill(m); saveS.disabled = true; hintS.textContent = ''; }
});
fPass.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!cur.value || !nw.value) return toast('Fill in your current and new password', 'warning');
  if (nw.value.length < 8) return toast('New password must be at least 8 characters', 'warning');
  if (nw.value !== nw2.value) return toast('New passwords do not match', 'warning');
  const ok = await save({ current_password: cur.value, new_password: nw.value }, 'Password updated');
  if (ok) { cur.value = nw.value = nw2.value = ''; }
});

if (requireLogin()) (async () => {
  try {
    const [m, campuses] = await Promise.all([api('/auth/me'), api('/campuses', { auth: false })]);
    pCampus.innerHTML = '<option value="">Select</option>' + campuses.map((c) => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('');
    me = m; fill(m);
  } catch (e) { fail(e); }
})();
</script></body></html>
